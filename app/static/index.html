/* ────────────────────────────────────────────────────
   HELPERS
──────────────────────────────────────────────────── */
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function badge(text, cls) {
  return '<span class="badge badge-' + esc(cls) + '">' + esc(text) + '</span>';
}

function riskColor(level) {
  return { low: '#16a34a', medium: '#d97706', high: '#ea580c', critical: '#dc2626' }[level] || '#57606a';
}

function gaugeColor(level) {
  return { low: '#16a34a', medium: '#eab308', high: '#f97316', critical: '#ef4444' }[level] || '#57606a';
}

function show(id)  { document.getElementById(id).classList.add('visible');    }
function hide(id)  { document.getElementById(id).classList.remove('visible'); }
function setHTML(id, html) { document.getElementById(id).innerHTML = html; }

/* ────────────────────────────────────────────────────
   POPULATE TAG SELECTORS
──────────────────────────────────────────────────── */
async function loadTags() {
  let tags;
  try {
    const resp = await fetch('/api/tags');
    if (!resp.ok) throw new Error('status ' + resp.status);
    tags = await resp.json();
  } catch (e) {
    console.warn('GET /api/tags failed, using fallback tags:', e.message);
    tags = ['v1.1.0', 'v1.0.0'];
  }
  // list_tags returns newest-first; From=oldest, To=newest
  const selFrom = document.getElementById('sel-from');
  const selTo   = document.getElementById('sel-to');
  tags.forEach(function(t) {
    selFrom.appendChild(new Option(t, t));
    selTo.appendChild(new Option(t, t));
  });
  // Default: From = oldest tag (last), To = newest tag (first)
  if (tags.length >= 2) {
    selFrom.value = tags[tags.length - 1];
    selTo.value   = tags[0];
  } else if (tags.length === 1) {
    selFrom.value = tags[0];
    selTo.value   = tags[0];
  }
  // Prevent From == To: when user changes From, if equal to To, shift To
  selFrom.addEventListener('change', function() {
    if (selFrom.value === selTo.value) {
      // pick the first option that differs
      for (var i = 0; i < selTo.options.length; i++) {
        if (selTo.options[i].value !== selFrom.value) {
          selTo.value = selTo.options[i].value;
          break;
        }
      }
    }
  });
  selTo.addEventListener('change', function() {
    if (selTo.value === selFrom.value) {
      for (var i = 0; i < selFrom.options.length; i++) {
        if (selFrom.options[i].value !== selTo.value) {
          selFrom.value = selFrom.options[i].value;
          break;
        }
      }
    }
  });
}

/* ────────────────────────────────────────────────────
   RUN ANALYSIS
──────────────────────────────────────────────────── */
async function runAnalysis() {
  const from = document.getElementById('sel-from').value;
  const to   = document.getElementById('sel-to').value;
  const btn  = document.getElementById('btn-run');

  hide('msg-error');
  hide('report');
  show('msg-loading');
  btn.disabled = true;

  let data;
  try {
    const resp = await fetch('/api/report?from=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to));
    if (!resp.ok) throw new Error('Server returned ' + resp.status);
    data = await resp.json();
  } catch (e) {
    console.warn('GET /api/report failed, using FIXTURE_DATA:', e.message);
    data = FIXTURE_DATA;
    document.getElementById('msg-error').innerHTML =
      '⚠️ Backend unavailable — showing fixture data for <strong>' + esc(from) + ' → ' + esc(to) + '</strong>.';
    show('msg-error');
  }

  hide('msg-loading');
  btn.disabled = false;
  renderReport(data);
}

/* ────────────────────────────────────────────────────
   RENDER
──────────────────────────────────────────────────── */
function renderReport(d) {
  renderSummary(d.range);
  renderRisk(d.risk);
  renderChanges(d.changes);
  renderCoverage(d.coverage);
  renderSentinel(d.sentinel);
  renderDrafts(d.drafts);
  show('report');
  document.getElementById('report').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* Summary strip */
function renderSummary(range) {
  const html =
    '<div class="summary-chip">Range: <strong>' + esc(range.from) + ' → ' + esc(range.to) + '</strong></div>' +
    '<div class="summary-chip">Commits: <strong>' + esc(range.commits) + '</strong></div>' +
    '<div class="summary-chip">Files changed: <strong>' + esc(range.files_changed) + '</strong></div>';
  setHTML('summary-strip', html);
}

/* Risk card */
function renderRisk(risk) {
  const level = risk.level || 'low';
  const score = risk.score || 0;
  const color = gaugeColor(level);

  let html = '<div class="gauge-row">';
  html += '<div class="gauge-score" style="color:' + color + '">' + esc(score) + '</div>';
  html += '<div class="gauge-bar-wrap">';
  html += '<div class="gauge-label">Risk level: ' + badge(level, level) + '</div>';
  html += '<div class="gauge-track"><div class="gauge-fill" style="width:' + score + '%;background:' + color + '"></div></div>';
  html += '<div class="range-info">Score ' + esc(score) + ' / 100</div>';
  html += '</div></div>';

  if (risk.drivers && risk.drivers.length) {
    const sorted = risk.drivers.slice().sort(function(a, b) { return b.points - a.points; });
    html += '<p class="section-sub">Risk drivers</p><ul class="drivers">';
    sorted.forEach(function(drv) {
      html += '<li><span class="driver-pts">+' + esc(drv.points) + '</span><span>' + esc(drv.label) + '</span></li>';
    });
    html += '</ul>';
  }

  setHTML('risk-content', html);
}

/* Changes */
function renderChanges(changes) {
  if (!changes || !changes.length) {
    setHTML('changes-content', '<p class="empty-note">No changes found.</p>');
    return;
  }
  const order = { breaking: 0, risky: 1, safe: 2 };
  const sorted = changes.slice().sort(function(a, b) {
    return (order[a.risk] || 99) - (order[b.risk] || 99);
  });

  let html = '<ul class="changes-list">';
  sorted.forEach(function(c) {
    const added   = c.lines_added   > 0 ? '<span class="lines-added">+' + c.lines_added + '</span> ' : '';
    const removed = c.lines_removed > 0 ? '<span class="lines-removed">−' + c.lines_removed + '</span>' : '';
    html += '<li>';
    html += '<div>';
    html += '<div class="change-path">' + esc(c.path) + ' ' + badge(c.status || '', c.status || '') + '</div>';
    html += '<div class="change-reason">' + esc(c.reason) + '</div>';
    html += '</div>';
    html += '<div style="text-align:right">';
    html += badge(c.risk, c.risk);
    html += '<div class="change-lines">' + added + removed + '</div>';
    html += '</div>';
    html += '</li>';
  });
  html += '</ul>';
  setHTML('changes-content', html);
}

/* Coverage */
function renderCoverage(cov) {
  let html = '';

  // Gaps
  html += '<p class="section-sub">Coverage gaps (' + (cov.gaps ? cov.gaps.length : 0) + ')</p>';
  if (cov.gaps && cov.gaps.length) {
    html += '<ul class="gap-list">';
    cov.gaps.forEach(function(g) {
      html += '<li>';
      html += '<div class="gap-path">' + esc(g.path) + '</div>';
      html += '<div class="gap-reason">' + esc(g.reason) + '</div>';
      if (g.suggested_test) html += '<div class="gap-suggestion">' + esc(g.suggested_test) + '</div>';
      html += '</li>';
    });
    html += '</ul>';
  } else {
    html += '<p class="empty-note">No gaps detected.</p>';
  }

  // Covered
  if (cov.covered && cov.covered.length) {
    html += '<p class="section-sub">Covered files</p>';
    html += '<ul class="covered-list">';
    cov.covered.forEach(function(c) {
      html += '<li title="' + esc(c.tests.join(', ')) + '">' + esc(c.path) + '</li>';
    });
    html += '</ul>';
  }

  // Stubs
  if (cov.stubs && cov.stubs.length) {
    html += '<p class="section-sub">Generated test stubs</p>';
    cov.stubs.forEach(function(s) {
      html += '<details class="evidence" style="margin-top:4px">';
      html += '<summary>' + esc(s.path) + '</summary>';
      html += '<pre>' + esc(s.content) + '</pre>';
      html += '</details>';
    });
  }

  setHTML('coverage-content', html);
}

/* Sentinel */
function renderSentinel(sentinel) {
  const findings = sentinel && sentinel.findings ? sentinel.findings : [];
  if (!findings.length) {
    setHTML('sentinel-content', '<p class="empty-note">No sentinel findings.</p>');
    return;
  }
  let html = '<ul class="finding-list">';
  findings.forEach(function(f) {
    html += '<li>';
    html += '<div class="finding-header">';
    html += '<span class="finding-kind">' + esc(f.kind) + '</span>';
    html += badge(f.severity, f.severity);
    html += '</div>';
    html += '<div class="finding-location">📍 ' + esc(f.location) + '</div>';
    html += '<div class="finding-detail">' + esc(f.detail) + '</div>';
    if (f.evidence) {
      html += '<details class="evidence"><summary>Show evidence</summary><pre>' + esc(f.evidence) + '</pre></details>';
    }
    html += '</li>';
  });
  html += '</ul>';
  setHTML('sentinel-content', html);
}

/* Drafts (release notes + rollback + pre_release_fixes) */
function renderDrafts(drafts) {
  // Release notes
  const notes = (drafts && drafts.release_notes_md) ? drafts.release_notes_md : '';
  setHTML('release-content', '<pre class="release-notes">' + esc(notes) + '</pre>');

  // Fix before release (pre_release_fixes)
  const fixes = (drafts && drafts.pre_release_fixes) ? drafts.pre_release_fixes : [];
  if (!fixes.length) {
    setHTML('prefixes-content', '<p class="empty-note">No pre-release fixes required.</p>');
  } else {
    let fhtml = '<ul class="rollback-list">';
    fixes.forEach(function(f) {
      fhtml += '<li>';
      fhtml += '<div class="step-num" style="background:#d97706">!</div>';
      fhtml += '<div>';
      fhtml += '<div class="step-action">' + esc(f.action) + '</div>';
      fhtml += '<div class="step-reason">' + esc(f.reason) + '</div>';
      fhtml += '</div>';
      fhtml += '</li>';
    });
    fhtml += '</ul>';
    setHTML('prefixes-content', fhtml);
  }

  // Rollback steps
  const steps = (drafts && drafts.rollback_steps) ? drafts.rollback_steps : [];
  if (!steps.length) {
    setHTML('rollback-content', '<p class="empty-note">No rollback steps.</p>');
    return;
  }
  let html = '<ul class="rollback-list">';
  steps.forEach(function(s) {
    html += '<li>';
    html += '<div class="step-num">' + esc(s.step) + '</div>';
    html += '<div>';
    html += '<div class="step-action">' + esc(s.action) + '</div>';
    html += '<div class="step-reason">' + esc(s.reason) + '</div>';
    html += '</div>';
    html += '</li>';
  });
  html += '</ul>';
  setHTML('rollback-content', html);
}

/* ────────────────────────────────────────────────────
   INIT
──────────────────────────────────────────────────── */
loadTags();
</script>
